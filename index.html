<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlow Studio OS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background-color: #0B0F19;
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar to look like macOS */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0F19;
        }
        ::-webkit-scrollbar-thumb {
            background: #24324F;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3B82F6;
        }
    </style>
</head>
<body class="text-gray-200 antialiased selection:bg-blue-500/30">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;

        // Pull icons directly from the global Lucide object
        const { 
          LayoutDashboard, Kanban, Wallet, Timer, Zap, Download, Upload, 
          Play, Pause, RotateCcw, CheckCircle, Circle, ArrowUpRight, 
          DollarSign, TrendingUp, AlertTriangle, ShieldCheck, HardDrive, ExternalLink 
        } = lucide;

        // ==========================================
        // DATA MATRIX CONFIGURATION
        // ==========================================
        const initialData = {
          projects: [
            {
              id: "proj-1",
              name: "Cyberpunk Commercial Cut",
              clientName: "Neon Media Agency",
              clientEmail: "contact@neonmedia.tv",
              rateType: "Fixed", 
              rate: 3500,
              hoursLogged: 24.5,
              stage: "Rough Cut", 
              assetFolderLink: "https://drive.google.com/drive/folders/mock-neon",
              notes: [
                { id: "note-1", timestamp: "01:23", text: "Fix color exposure on the wide shot", completed: false },
                { id: "note-2", timestamp: "03:45", text: "Snappy sound design transition when text pops up", completed: true }
              ]
            },
            {
              id: "proj-2",
              name: "Corporate Retrospective 2026",
              clientName: "Initech Corp",
              clientEmail: "billing@initech.com",
              rateType: "Hourly",
              rate: 85,
              hoursLogged: 12.0,
              stage: "Footage Ingest",
              assetFolderLink: "https://dropbox.com/sh/mock-initech",
              notes: []
            }
          ],
          expenses: [
            { id: "exp-1", name: "Adobe Creative Cloud", amount: 54.99, type: "Recurring", category: "Software" },
            { id: "exp-2", name: "Envato Elements", amount: 33.00, type: "Recurring", category: "Assets" },
            { id: "exp-3", name: "LaCie Rugged 4TB HDD", amount: 149.00, type: "One-off", category: "Hardware" }
          ],
          invoices: [
            { id: "inv-1", projectId: "proj-1", invoiceNumber: "INV-2026-001", amount: 1750, status: "Paid", issueDate: "2026-05-15" },
            { id: "inv-2", projectId: "proj-1", invoiceNumber: "INV-2026-002", amount: 1750, status: "Sent", issueDate: "2026-06-01" }
          ],
          activeTimer: {
            projectId: "proj-1",
            startTime: null,
            elapsedSeconds: 0,
            isRunning: false
          },
          timeLogs: [
            { id: "log-1", projectId: "proj-1", date: "2026-06-04", hours: 4.5 },
            { id: "log-2", projectId: "proj-1", date: "2026-06-05", hours: 3.2 }
          ],
          renderLogs: [
            { id: "ren-1", resolution: "4K", codec: "ProRes 422 HQ", software: "DaVinci Resolve", hardware: "Mac Studio M2 Ultra", durationMinutes: 12, renderTimeMinutes: 4.5 }
          ],
          assetCatalog: [
            { id: "ast-1", name: "Cinematic Whoosh SFX Pack", tags: ["SFX", "Audio"], location: "Local NAS / Audio / SFX" },
            { id: "ast-2", name: "Teal & Orange Premium LUT", tags: ["LUT", "Color"], location: "D:/LUTs/Creative/" }
          ],
          productivity: {
            dailyStreak: 8,
            lastWorkedDate: "2026-06-05"
          }
        };

        const STAGES = [
          "Footage Ingest", "Script/Storyboarding", "Rough Cut", 
          "V1 Review", "Audio/Sound Design", "Color Grading", 
          "Final Render", "Approved", "Archived"
        ];

        const AppStateContext = createContext(undefined);
        const LOCAL_STORAGE_KEY = 'EDITOR_STUDIO_SYSTEM_STATE';

        // ==========================================
        // STATE PROVIDER ENGINE
        // ==========================================
        function AppStateProvider({ children }) {
          const [state, setState] = useState(() => {
            try {
              const savedState = localStorage.getItem(LOCAL_STORAGE_KEY);
              if (savedState) return JSON.parse(savedState);
            } catch (e) {
              console.error("Local state loading failed", e);
            }
            return initialData;
          });

          useEffect(() => {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state));
          }, [state]);

          useEffect(() => {
            let interval = null;
            if (state.activeTimer?.isRunning) {
              interval = setInterval(() => {
                setState(prev => {
                  const now = Date.now();
                  const lastChecked = prev.activeTimer.lastChecked || now;
                  const delta = Math.floor((now - lastChecked) / 1000);
                  return {
                    ...prev,
                    activeTimer: {
                      ...prev.activeTimer,
                      elapsedSeconds: prev.activeTimer.elapsedSeconds + (delta || 1),
                      lastChecked: now
                    }
                  };
                });
              }, 1000);
            }
            return () => clearInterval(interval);
          }, [state.activeTimer?.isRunning]);

          const exportSystemState = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", "editor_studio_backup.json");
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
          };

          const importSystemState = (e) => {
            const reader = new FileReader();
            const file = e.target.files[0];
            if (!file) return;
            reader.onload = (evt) => {
              try {
                const parsed = JSON.parse(evt.target.result);
                if (parsed.projects && parsed.expenses) {
                  setState(parsed);
                  alert("Studio backup state restored successfully.");
                }
              } catch (err) {
                alert("Invalid file format.");
              }
            };
            reader.readAsText(file);
          };

          return (
            <AppStateContext.Provider value={{ state, setState, exportSystemState, importSystemState }}>
              {children}
            </AppStateContext.Provider>
          );
        }

        function useAppState() {
          return useContext(AppStateContext);
        }

        function calculateMetrics(state) {
          const grossIncome = state.invoices.filter(i => i.status === 'Paid').reduce((acc, curr) => acc + curr.amount, 0);
          const pendingIncome = state.invoices.filter(i => i.status === 'Sent').reduce((acc, curr) => acc + curr.amount, 0);
          const totalExpenses = state.expenses.reduce((acc, curr) => acc + curr.amount, 0);
          const netProfit = grossIncome - totalExpenses;
          const taxWithholding = netProfit > 0 ? netProfit * 0.25 : 0;
          const totalHours = state.projects.reduce((acc, curr) => acc + curr.hoursLogged, 0);
          const totalRevenueAllTime = state.projects.reduce((acc, curr) => acc + curr.rate, 0);
          const trueHourlyRate = totalHours > 0 ? (totalRevenueAllTime / totalHours) : 0;

          return { grossIncome, pendingIncome, totalExpenses, netProfit, taxWithholding, trueHourlyRate, totalHours };
        }

        // ==========================================
        // APP VIEWS ARCHITECTURE
        // ==========================================
        function Sidebar({ activeTab, setActiveTab }) {
          const { exportSystemState, importSystemState } = useAppState();
          const tabs = [
            { id: 'dashboard', name: 'Studio Metrics', icon: LayoutDashboard },
            { id: 'pipeline', name: 'Production Pipeline', icon: Kanban },
            { id: 'finances', name: 'Finance Engine', icon: Wallet },
            { id: 'tracker', name: 'Session Timer', icon: Timer },
            { id: 'utilities', name: 'Utility Studio', icon: Zap },
          ];

          return (
            <aside class="w-64 bg-[#151D30] border-r border-[#24324F] flex flex-col justify-between h-screen sticky top-0 text-gray-200">
              <div class="p-6">
                <div class="flex items-center gap-3 mb-8">
                  <div class="h-8 w-8 bg-blue-500 rounded-lg flex items-center justify-center font-bold text-white">Ω</div>
                  <h1 class="text-xl font-extrabold text-white tracking-tight">CINE<span class="text-blue-500">FLOW</span></h1>
                </div>
                <nav class="space-y-1">
                  {tabs.map((tab) => {
                    const Icon = tab.icon;
                    return (
                      <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-sm font-medium ${
                          activeTab === tab.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'text-gray-400 hover:bg-[#24324F]/50 hover:text-white'
                        }`}
                      >
                        <Icon size={18} /> {tab.name}
                      </button>
                    );
                  })}
                </nav>
              </div>
              <div class="p-4 border-t border-[#24324F] bg-black/20 space-y-2">
                <div class="text-[10px] font-bold tracking-wider text-gray-500 uppercase px-2 mb-1">Local Sandbox Mode</div>
                <button onClick={exportSystemState} class="w-full flex items-center justify-center gap-2 px-3 py-2 bg-[#24324F]/40 hover:bg-[#24324F] text-xs text-white font-medium rounded-lg transition-colors border border-[#24324F]">
                  <Download size={14} /> Save & Export Backup
                </button>
                <label class="w-full flex items-center justify-center gap-2 px-3 py-2 bg-transparent hover:bg-[#24324F]/20 text-xs text-gray-400 hover:text-white font-medium rounded-lg transition-colors border border-dashed border-[#24324F] cursor-pointer">
                  <Upload size={14} /> Restore System Backups
                  <input type="file" accept=".json" onChange={importSystemState} class="hidden" />
                </label>
              </div>
            </aside>
          );
        }

        function DashboardView() {
          const { state } = useAppState();
          const metrics = calculateMetrics(state);

          return (
            <div class="space-y-8">
              <div class="flex justify-between items-center">
                <div>
                  <h2 class="text-3xl font-bold text-white tracking-tight">Studio Performance Suite</h2>
                  <p class="text-gray-400 text-sm mt-1">Real-time localized analytics compiled directly from engine storage instances.</p>
                </div>
                <div class="flex items-center gap-2 bg-[#151D30] border border-[#24324F] px-4 py-2 rounded-xl">
                  <Zap size={16} class="text-amber-400" />
                  <span class="text-sm font-semibold text-white">Daily Streak: {state.productivity.dailyStreak} Days</span>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-[#151D30] p-6 rounded-2xl border border-[#24324F]">
                  <div class="flex justify-between items-start text-gray-400">
                    <span class="text-xs font-bold uppercase tracking-wider">Gross Income</span>
                    <DollarSign size={16} class="text-emerald-500" />
                  </div>
                  <div class="text-2xl font-bold text-white mt-2">${metrics.grossIncome.toLocaleString()}</div>
                  <div class="text-xs text-gray-500 mt-1">From clear settled invoices</div>
                </div>
                <div class="bg-[#151D30] p-6 rounded-2xl border border-[#24324F]">
                  <div class="flex justify-between items-start text-gray-400">
                    <span class="text-xs font-bold uppercase tracking-wider">Net Profit margin</span>
                    <TrendingUp size={16} class="text-blue-500" />
                  </div>
                  <div class="text-2xl font-bold text-white mt-2">${metrics.netProfit.toLocaleString()}</div>
                  <div class="text-xs text-emerald-400 mt-1">Post operational expense deductions</div>
                </div>
                <div class="bg-[#151D30] p-6 rounded-2xl border border-[#24324F]">
                  <div class="flex justify-between items-start text-gray-400">
                    <span class="text-xs font-bold uppercase tracking-wider">True Hourly Value</span>
                    <ArrowUpRight size={16} class="text-indigo-400" />
                  </div>
                  <div class="text-2xl font-bold text-white mt-2">${metrics.trueHourlyRate.toFixed(2)}/hr</div>
                  <div class="text-xs text-gray-500 mt-1">Across all logged timeline records</div>
                </div>
                <div class="bg-[#151D30] p-6 rounded-2xl border border-[#24324F]">
                  <div class="flex justify-between items-start text-gray-400">
                    <span class="text-xs font-bold uppercase tracking-wider">Tax Provision Pool</span>
                    <ShieldCheck size={16} class="text-amber-500" />
                  </div>
                  <div class="text-2xl font-bold text-white mt-2">${metrics.taxWithholding.toLocaleString()}</div>
                  <div class="text-xs text-amber-500 mt-1">Recommended 25% allocation</div>
                </div>
              </div>

              {metrics.totalHours > 40 && (
                <div class="bg-red-500/10 border border-red-500/20 rounded-2xl p-4 flex gap-3 items-center">
                  <AlertTriangle class="text-red-500 shrink-0" size={20} />
                  <div>
                    <div class="text-sm font-bold text-white">System Guard Alert: Burnout Warning</div>
                    <div class="text-xs text-gray-400 mt-0.5">Your aggregated workspace time allocation exceeds safety guidelines. Consider scheduling downtime.</div>
                  </div>
                </div>
              )}

              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-[#151D30] border border-[#24324F] p-6 rounded-2xl">
                  <h3 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-4">Pipeline Project Loading Distributions</h3>
                  <div class="space-y-3">
                    {state.projects.map(p => (
                      <div key={p.id} class="space-y-1">
                        <div class="flex justify-between text-xs font-medium">
                          <span class="text-white">{p.name}</span>
                          <span class="text-gray-400">{p.hoursLogged} hrs logged</span>
                        </div>
                        <div class="w-full bg-[#24324F] h-2 rounded-full overflow-hidden">
                          <div class="bg-blue-500 h-full rounded-full" style={{ width: `${Math.min((p.hoursLogged / 40) * 100, 100)}%` }}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div class="bg-[#151D30] border border-[#24324F] p-6 rounded-2xl flex flex-col justify-between">
                  <div>
                    <h3 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-2">Cloud Storage & Webhook Mocks</h3>
                    <p class="text-xs text-gray-500 mb-4">Architected API frameworks running within clean simulated runtimes.</p>
                    <div class="space-y-2">
                      <div class="flex items-center justify-between p-2 bg-[#0B0F19] rounded-xl text-xs border border-[#24324F]">
                        <span class="text-gray-400">Google Drive Storage Tier Limit</span>
                        <span class="text-emerald-400 font-mono font-bold">12.4 GB / 15 GB Free</span>
                      </div>
                      <div class="flex items-center justify-between p-2 bg-[#0B0F19] rounded-xl text-xs border border-[#24324F]">
                        <span class="text-gray-400">Stripe Webhook Verification Status</span>
                        <span class="text-blue-400 font-mono font-bold">READY (TEST_MODE)</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        function PipelineView() {
          const { state, setState } = useAppState();
          const [selectedProj, setSelectedProj] = useState(state.projects[0]?.id || null);
          const [newNote, setNewNote] = useState({ timestamp: "", text: "" });

          const activeProject = state.projects.find(p => p.id === selectedProj);

          const moveProjectStage = (id, nextStage) => {
            setState(prev => ({
              ...prev,
              projects: prev.projects.map(p => p.id === id ? { ...p, stage: nextStage } : p)
            }));
          };

          const addFeedbackNote = (e) => {
            e.preventDefault();
            if (!newNote.text) return;
            setState(prev => ({
              ...prev,
              projects: prev.projects.map(p => p.id === selectedProj ? {
                ...p,
                notes: [...p.notes, { id: `note-${Date.now()}`, timestamp: newNote.timestamp || "00:00", text: newNote.text, completed: false }]
              } : p)
            }));
            setNewNote({ timestamp: "", text: "" });
          };

          const toggleNoteComplete = (projId, noteId) => {
            setState(prev => ({
              ...prev,
              projects: prev.projects.map(p => p.id === projId ? {
                ...p,
                notes: p.notes.map(n => n.id === noteId ? { ...n, completed: !n.completed } : n)
              } : p)
            }));
          };

          return (
            <div class="space-y-8">
              <div>
                <h2 class="text-3xl font-bold text-white tracking-tight">Production Pipeline</h2>
                <p class="text-gray-400 text-sm mt-1">Granular kanban staging matrices paired with real-time feedback anchors.</p>
              </div>

              <div class="flex gap-4 overflow-x-auto pb-4 select-none">
                {STAGES.map(stage => {
                  const matchedProjects = state.projects.filter(p => p.stage === stage);
                  return (
                    <div key={stage} class="w-80 bg-[#151D30] p-4 rounded-2xl border border-[#24324F] flex-shrink-0 flex flex-col justify-between">
                      <div>
                        <div class="flex justify-between items-center mb-3">
                          <span class="text-xs font-bold text-white uppercase tracking-wider">{stage}</span>
                          <span class="px-2 py-0.5 bg-[#24324F] text-gray-400 rounded-md text-[10px] font-bold">{matchedProjects.length}</span>
                        </div>
                        <div class="space-y-3">
                          {matchedProjects.map(p => (
                            <div 
                              key={p.id} 
                              onClick={() => setSelectedProj(p.id)}
                              className={`p-3 bg-[#0B0F19] border rounded-xl cursor-pointer transition-all ${selectedProj === p.id ? 'border-blue-500 shadow-lg shadow-blue-500/10' : 'border-[#24324F] hover:border-gray-500'}`}
                            >
                              <div class="text-sm font-bold text-white mb-1">{p.name}</div>
                              <div class="text-xs text-gray-400">{p.clientName}</div>
                              <div class="mt-3 flex justify-between items-center">
                                <span class="text-[10px] font-bold tracking-wider px-2 py-0.5 bg-blue-500/10 text-blue-400 rounded border border-blue-500/20">{p.rateType}</span>
                                <select 
                                  value={p.stage} 
                                  onChange={(e) => moveProjectStage(p.id, e.target.value)}
                                  class="bg-[#151D30] border border-[#24324F] text-[11px] font-medium rounded p-1 text-gray-300 focus:outline-none"
                                >
                                  {STAGES.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {activeProject && (
                <div class="bg-[#151D30] border border-[#24324F] rounded-2xl p-6">
                  <div class="border-b border-[#24324F] pb-4 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                      <div class="text-xs font-bold text-blue-500 uppercase tracking-wider mb-1">Feedback Logger & Operations Hub</div>
                      <h3 class="text-xl font-bold text-white">{activeProject.name} — {activeProject.clientName}</h3>
                    </div>
                    {activeProject.assetFolderLink && (
                      <a href={activeProject.assetFolderLink} target="_blank" rel="noreferrer" class="flex items-center gap-2 bg-[#24324F] text-xs text-white font-medium px-3 py-2 rounded-xl border border-[#24324F] hover:bg-blue-600 hover:border-blue-600 transition-all">
                        <HardDrive size={14} /> Open Secure Asset Directories <ExternalLink size={12} />
                      </a>
                    )}
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="md:col-span-2 space-y-3">
                      <h4 class="text-xs font-bold uppercase tracking-wider text-gray-400">Timestamped Target Operations</h4>
                      {activeProject.notes.length === 0 ? (
                        <div class="p-4 border border-dashed border-[#24324F] rounded-xl text-center text-xs text-gray-500">No timestamp review markers currently mapped.</div>
                      ) : (
                        <div class="space-y-2">
                          {activeProject.notes.map(note => (
                            <div 
                              key={note.id} 
                              onClick={() => toggleNoteComplete(activeProject.id, note.id)}
                              className={`flex items-start gap-3 p-3 rounded-xl border transition-all cursor-pointer ${note.completed ? 'bg-black/20 border-[#24324F]/40 opacity-50' : 'bg-[#0B0F19] border-[#24324F]'}`}
                            >
                              {note.completed ? <CheckCircle size={16} class="text-emerald-500 shrink-0 mt-0.5" /> : <Circle size={16} class="text-gray-500 shrink-0 mt-0.5" />}
                              <div class="text-xs">
                                <span class="font-mono bg-[#24324F] px-1.5 py-0.5 rounded text-blue-400 mr-2 font-bold">{note.timestamp}</span>
                                <span class={note.completed ? 'line-through text-gray-500' : 'text-gray-200'}>{note.text}</span>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <form onSubmit={addFeedbackNote} class="space-y-3 bg-[#0B0F19] p-4 rounded-xl border border-[#24324F] h-fit">
                      <h4 class="text-xs font-bold uppercase tracking-wider text-gray-400">Add Live Revision Node</h4>
                      <div>
                        <label class="block text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1">Time Marker</label>
                        <input 
                          type="text" placeholder="e.g., 04:32" value={newNote.timestamp} onChange={e => setNewNote({...newNote, timestamp: e.target.value})}
                          class="w-full bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-white focus:outline-none focus:border-blue-500"
                        />
                      </div>
                      <div>
                        <label class="block text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1">Note Narrative</label>
                        <textarea 
                          rows={3} placeholder="Paste client direct instructions..." value={newNote.text} onChange={e => setNewNote({...newNote, text: e.target.value})}
                          class="w-full bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-white focus:outline-none focus:border-blue-500 resize-none"
                        />
                      </div>
                      <button type="submit" class="w-full bg-blue-600 text-xs font-bold py-2 rounded-lg hover:bg-blue-500 text-white transition-colors">Inject Note Context</button>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        function FinanceView() {
          const { state, setState } = useAppState();
          const metrics = calculateMetrics(state);
          const [newExpense, setNewExpense] = useState({ name: "", amount: "", type: "Recurring", category: "Software" });
          const [newInvoice, setNewInvoice] = useState({ projectId: state.projects[0]?.id || "", invoiceNumber: "", amount: "", status: "Draft" });

          const addExpense = (e) => {
            e.preventDefault();
            if (!newExpense.name || !newExpense.amount) return;
            setState(prev => ({
              ...prev,
              expenses: [...prev.expenses, { id: `exp-${Date.now()}`, name: newExpense.name, amount: parseFloat(newExpense.amount), type: newExpense.type, category: newExpense.category }]
            }));
            setNewExpense({ name: "", amount: "", type: "Recurring", category: "Software" });
          };

          const addInvoice = (e) => {
            e.preventDefault();
            if (!newInvoice.invoiceNumber || !newInvoice.amount) return;
            setState(prev => ({
              ...prev,
              invoices: [...prev.invoices, { id: `inv-${Date.now()}`, projectId: newInvoice.projectId, invoiceNumber: newInvoice.invoiceNumber, amount: parseFloat(newInvoice.amount), status: newInvoice.status, issueDate: new Date().toISOString().split('T')[0] }]
            }));
            setNewInvoice({ projectId: state.projects[0]?.id || "", invoiceNumber: "", amount: "", status: "Draft" });
          };

          return (
            <div class="space-y-8">
              <div>
                <h2 class="text-3xl font-bold text-white tracking-tight">Financial Hub & Tax Router</h2>
                <p class="text-gray-400 text-sm mt-1">Cross-referenced margin calculations tracking operational overhead profiles.</p>
              </div>

              <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-[#151D30] border border-[#24324F] rounded-2xl p-6">
                  <h3 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-4">Studio Operational Expenditures</h3>
                  <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-gray-300">
                      <thead class="text-[10px] uppercase font-bold tracking-wider border-b border-[#24324F] text-gray-500">
                        <tr>
                          <th class="pb-3">Descriptor</th>
                          <th class="pb-3">Tax Target Class</th>
                          <th class="pb-3">Interval Profile</th>
                          <th class="pb-3 text-right">Magnitude Allocation</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-[#24324F]/60">
                        {state.expenses.map(exp => (
                          <tr key={exp.id} class="hover:bg-black/10">
                            <td class="py-3 font-semibold text-white">{exp.name}</td>
                            <td class="py-3"><span class="bg-[#24324F] px-2 py-0.5 rounded text-gray-400">{exp.category}</span></td>
                            <td class="py-3 text-gray-400">{exp.type}</td>
                            <td class="py-3 text-right text-red-400 font-bold font-mono">${exp.amount.toFixed(2)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                <form onSubmit={addExpense} class="bg-[#0B0F19] p-5 rounded-2xl border border-[#24324F] space-y-3 h-fit">
                  <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400">Log Operational Expense</h3>
                  <input type="text" placeholder="Expense Name" value={newExpense.name} onChange={e => setNewExpense({...newExpense, name: e.target.value})} class="w-full bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-white focus:outline-none focus:border-blue-500" />
                  <input type="number" step="0.01" placeholder="Amount ($)" value={newExpense.amount} onChange={e => setNewExpense({...newExpense, amount: e.target.value})} class="w-full bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-white focus:outline-none focus:border-blue-500" />
                  <div class="grid grid-cols-2 gap-2">
                    <select value={newExpense.type} onChange={e => setNewExpense({...newExpense, type: e.target.value})} class="bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-gray-300">
                      <option value="Recurring">Recurring</option>
                      <option value="One-off">One-off</option>
                    </select>
                    <select value={newExpense.category} onChange={e => setNewExpense({...newExpense, category: e.target.value})} class="bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-gray-300">
                      <option value="Software">Software</option>
                      <option value="Assets">Assets</option>
                      <option value="Hardware">Hardware</option>
                    </select>
                  </div>
                  <button type="submit" class="w-full bg-blue-600 text-xs font-bold py-2 rounded-lg hover:bg-blue-500 transition-colors text-white">Commit Cost Record</button>
                </form>
              </div>

              <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-[#151D30] border border-[#24324F] rounded-2xl p-6">
                  <h3 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-4">Invoice Ledger Matrix</h3>
                  <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-gray-300">
                      <thead class="text-[10px] uppercase font-bold tracking-wider border-b border-[#24324F] text-gray-500">
                        <tr>
                          <th class="pb-3">Invoice ID</th>
                          <th class="pb-3">Associated Target</th>
                          <th class="pb-3">Timestamped Generation</th>
                          <th class="pb-3">Lifecycle Node</th>
                          <th class="pb-3 text-right">Value Mapping</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-[#24324F]/60">
                        {state.invoices.map(inv => {
                          const matchingProj = state.projects.find(p => p.id === inv.projectId);
                          return (
                            <tr key={inv.id} class="hover:bg-black/10">
                              <td class="py-3 font-mono text-blue-400 font-bold">{inv.invoiceNumber}</td>
                              <td class="py-3 text-white font-medium">{matchingProj?.name || "Global Scope"}</td>
                              <td class="py-3 text-gray-400">{inv.issueDate}</td>
                              <td class="py-3">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                  inv.status === 'Paid' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
                                }`}>{inv.status}</span>
                              </td>
                              <td class="py-3 text-right font-bold text-white font-mono">${inv.amount.toLocaleString()}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>

                <form onSubmit={addInvoice} class="bg-[#0B0F19] p-5 rounded-2xl border border-[#24324F] space-y-3 h-fit">
                  <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400">Generate Client Invoice</h3>
                  <select value={newInvoice.projectId} onChange={e => setNewInvoice({...newInvoice, projectId: e.target.value})} class="w-full bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-gray-300">
                    {state.projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                  <input type="text" placeholder="e.g., INV-2026-88" value={newInvoice.invoiceNumber} onChange={e => setNewInvoice({...newInvoice, invoiceNumber: e.target.value})} class="w-full bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-white focus:outline-none" />
                  <input type="number" placeholder="Target Payout Level ($)" value={newInvoice.amount} onChange={e => setNewInvoice({...newInvoice, amount: e.target.value})} class="w-full bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-white focus:outline-none" />
                  <select value={newInvoice.status} onChange={e => setNewInvoice({...newInvoice, status: e.target.value})} class="w-full bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-gray-300">
                    <option value="Draft">Draft State</option>
                    <option value="Sent">Sent (Awaiting Settlement)</option>
                    <option value="Paid">Paid Fully</option>
                  </select>
                  <button type="submit" class="w-full bg-blue-600 text-xs font-bold py-2 rounded-lg text-white">Generate Invoice Struct</button>
                </form>
              </div>
            </div>
          );
        }

        function TrackerView() {
          const { state, setState } = useAppState();
          const [selectedProjId, setSelectedProjId] = useState(state.projects[0]?.id || "");
          const [manualLog, setManualLog] = useState({ date: new Date().toISOString().split('T')[0], hours: "" });

          const formatTime = (totalSeconds) => {
            const hrs = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const mins = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const secs = (totalSeconds % 60).toString().padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
          };

          const startTracking = () => {
            setState(prev => ({
              ...prev,
              activeTimer: { ...prev.activeTimer, projectId: selectedProjId, startTime: Date.now(), lastChecked: Date.now(), isRunning: true }
            }));
          };

          const stopTracking = () => {
            if (!state.activeTimer.isRunning) return;
            const hoursEarned = parseFloat((state.activeTimer.elapsedSeconds / 3600).toFixed(2));
            
            setState(prev => ({
              ...prev,
              timeLogs: [...prev.timeLogs, { id: `log-${Date.now()}`, projectId: prev.activeTimer.projectId, date: new Date().toISOString().split('T')[0], hours: hoursEarned }],
              projects: prev.projects.map(p => p.id === prev.activeTimer.projectId ? { ...p, hoursLogged: parseFloat((p.hoursLogged + hoursEarned).toFixed(2)) } : p),
              activeTimer: { projectId: "", startTime: null, elapsedSeconds: 0, isRunning: false }
            }));
          };

          const resetTimerState = () => {
            setState(prev => ({
              ...prev,
              activeTimer: { projectId: "", startTime: null, elapsedSeconds: 0, isRunning: false }
            }));
          };

          const handleManualOverride = (e) => {
            e.preventDefault();
            if (!manualLog.hours) return;
            const hrs = parseFloat(manualLog.hours);
            setState(prev => ({
              ...prev,
              timeLogs: [...prev.timeLogs, { id: `log-${Date.now()}`, projectId: selectedProjId, date: manualLog.date, hours: hrs }],
              projects: prev.projects.map(p => p.id === selectedProjId ? { ...p, hoursLogged: parseFloat((p.hoursLogged + hrs).toFixed(2)) } : p)
            }));
            setManualLog({ date: new Date().toISOString().split('T')[0], hours: "" });
          };

          const currentActiveProjectText = state.projects.find(p => p.id === state.activeTimer.projectId)?.name || "No Selected Profile Context";

          return (
            <div class="space-y-8">
              <div>
                <h2 class="text-3xl font-bold text-white tracking-tight">Persistent Clock Engine</h2>
                <p class="text-gray-400 text-sm mt-1">Multi-day hardware persistence threads surviving absolute session termination profiles.</p>
              </div>

              <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-[#151D30] border border-[#24324F] rounded-2xl p-8 flex flex-col items-center justify-center text-center">
                  <div class="text-xs font-bold text-blue-500 uppercase tracking-wider mb-2">Active Session Context</div>
                  <div class="text-sm font-medium text-white mb-6">{state.activeTimer.isRunning ? currentActiveProjectText : "Engine Awaiting Execution"}</div>
                  
                  <div class="text-6xl font-black text-white font-mono tracking-wider mb-8 bg-black/30 px-8 py-4 rounded-2xl border border-[#24324F]">
                    {formatTime(state.activeTimer.elapsedSeconds)}
                  </div>

                  <div class="flex gap-4">
                    {!state.activeTimer.isRunning ? (
                      <button onClick={startTracking} class="flex items-center gap-2 px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-all text-sm">
                        <Play size={16} /> Fire Tracking Stream
                      </button>
                    ) : (
                      <button onClick={stopTracking} class="flex items-center gap-2 px-6 py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl transition-all text-sm">
                        <Pause size={16} /> Halt & Commit Log
                      </button>
                    )}
                    <button onClick={resetTimerState} class="flex items-center gap-2 px-4 py-3 bg-[#24324F] text-gray-300 font-medium rounded-xl transition-all border border-[#24324F] text-sm">
                      <RotateCcw size={16} /> Wipe
                    </button>
                  </div>
                </div>

                <div class="bg-[#151D30] border border-[#24324F] rounded-2xl p-6 flex flex-col justify-between">
                  <form onSubmit={handleManualOverride} class="space-y-4">
                    <div>
                      <h3 class="text-sm font-bold uppercase tracking-wider text-gray-400">Manual Override</h3>
                      <p class="text-xs text-gray-500 mt-1">Direct state insertion metrics bypass clock loop sequences.</p>
                    </div>
                    <select value={selectedProjId} onChange={e => setSelectedProjId(e.target.value)} class="w-full bg-[#0B0F19] border border-[#24324F] rounded-lg p-2 text-xs text-gray-300">
                      {state.projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                    </select>
                    <input type="date" value={manualLog.date} onChange={e => setManualLog({...manualLog, date: e.target.value})} class="w-full bg-[#0B0F19] border border-[#24324F] rounded-lg p-2 text-xs text-white focus:outline-none" />
                    <input type="number" step="0.1" placeholder="Decimal Hours (e.g., 2.5)" value={manualLog.hours} onChange={e => setManualLog({...manualLog, hours: e.target.value})} class="w-full bg-[#0B0F19] border border-[#24324F] rounded-lg p-2 text-xs text-white focus:outline-none" />
                    <button type="submit" class="w-full bg-blue-600 text-xs font-bold py-2.5 rounded-lg text-white">Inject Log Block</button>
                  </form>
                </div>
              </div>

              <div class="bg-[#151D30] border border-[#24324F] rounded-2xl p-6">
                <h3 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-4">Historical Studio Timeline Entries</h3>
                <div class="space-y-2">
                  {state.timeLogs.map(log => {
                    const proj = state.projects.find(p => p.id === log.projectId);
                    return (
                      <div key={log.id} class="flex justify-between items-center p-3 bg-[#0B0F19] border border-[#24324F] rounded-xl text-xs">
                        <div>
                          <span class="font-bold text-white">{proj?.name || "Global Anchor"}</span>
                          <span class="text-gray-500 ml-2 font-mono">[{log.date}]</span>
                        </div>
                        <div class="font-bold text-blue-400 font-mono">+{log.hours} Processing Hours</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        }

        function UtilitiesView() {
          const { state, setState } = useAppState();
          const [newRender, setNewRender] = useState({ resolution: "4K", codec: "ProRes 422 HQ", software: "DaVinci Resolve", hardware: "Mac Studio M2 Ultra", durationMinutes: "", renderTimeMinutes: "" });
          const [newAsset, setNewAsset] = useState({ name: "", tags: "SFX", location: "" });

          const addRenderLog = (e) => {
            e.preventDefault();
            if (!newRender.durationMinutes || !newRender.renderTimeMinutes) return;
            setState(prev => ({
              ...prev,
              renderLogs: [...prev.renderLogs, {
                id: `ren-${Date.now()}`,
                ...newRender,
                durationMinutes: parseFloat(newRender.durationMinutes),
                renderTimeMinutes: parseFloat(newRender.renderTimeMinutes)
              }]
            }));
            setNewRender({ resolution: "4K", codec: "ProRes 422 HQ", software: "DaVinci Resolve", hardware: "Mac Studio M2 Ultra", durationMinutes: "", renderTimeMinutes: "" });
          };

          const addAssetNode = (e) => {
            e.preventDefault();
            if (!newAsset.name || !newAsset.location) return;
            setState(prev => ({
              ...prev,
              assetCatalog: [...prev.assetCatalog, { id: `ast-${Date.now()}`, name: newAsset.name, tags: [newAsset.tags], location: newAsset.location }]
            }));
            setNewAsset({ name: "", tags: "SFX", location: "" });
          };

          return (
            <div class="space-y-8">
              <div>
                <h2 class="text-3xl font-bold text-white tracking-tight">Utility Pack Framework</h2>
                <p class="text-gray-400 text-sm mt-1">Render telemetry calibration matrices mapped to hardware profiling registries.</p>
              </div>

              <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-[#151D30] border border-[#24324F] rounded-2xl p-6">
                  <h3 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-4">Hardware Processing Engine Telemetry</h3>
                  <div class="space-y-3">
                    {state.renderLogs.map(ren => {
                      const efficiencyRatio = (ren.durationMinutes / ren.renderTimeMinutes).toFixed(1);
                      return (
                        <div key={ren.id} class="p-4 bg-[#0B0F19] border border-[#24324F] rounded-xl text-xs space-y-2">
                          <div class="flex justify-between font-bold text-white">
                            <span>{ren.software} ({ren.codec})</span>
                            <span class="text-emerald-400 font-mono">{efficiencyRatio}x Compute Speed</span>
                          </div>
                          <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-gray-400">
                            <div>Res: <span class="text-white">{ren.resolution}</span></div>
                            <div>Rig: <span class="text-white text-[11px]">{ren.hardware}</span></div>
                            <div>Length: <span class="text-white">{ren.durationMinutes}m</span></div>
                            <div>Render: <span class="text-white">{ren.renderTimeMinutes}m</span></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <form onSubmit={addRenderLog} class="bg-[#0B0F19] p-5 rounded-2xl border border-[#24324F] space-y-3 h-fit">
                  <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400">Log Processing Statistics</h3>
                  <select value={newRender.resolution} onChange={e => setNewRender({...newRender, resolution: e.target.value})} class="w-full bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-gray-300">
                    <option value="4K">4K UHD Resolution</option>
                    <option value="1080p">1080p HD Scope</option>
                    <option value="8K">8K Master Frame</option>
                  </select>
                  <input type="text" placeholder="Codec Profile (e.g., ProRes)" value={newRender.codec} onChange={e => setNewRender({...newRender, codec: e.target.value})} class="w-full bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-white focus:outline-none" />
                  <input type="text" placeholder="Application Engine" value={newRender.software} onChange={e => setNewRender({...newRender, software: e.target.value})} class="w-full bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-white focus:outline-none" />
                  <input type="text" placeholder="Hardware Rig" value={newRender.hardware} onChange={e => setNewRender({...newRender, hardware: e.target.value})} class="w-full bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-white focus:outline-none" />
                  <div class="grid grid-cols-2 gap-2">
                    <input type="number" placeholder="Duration (m)" value={newRender.durationMinutes} onChange={e => setNewRender({...newRender, durationMinutes: e.target.value})} class="w-full bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-white focus:outline-none" />
                    <input type="number" placeholder="Render (m)" value={newRender.renderTimeMinutes} onChange={e => setNewRender({...newRender, renderTimeMinutes: e.target.value})} class="w-full bg-[#151D30] border border-[#24324F] rounded-lg p-2 text-xs text-white focus:outline-none" />
                  </div>
                  <button type="submit" class="w-full bg-blue-600 text-xs font-bold py-2 rounded-lg text-white">Log Telemetry</button>
                </form>
              </div>
            </div>
          );
        }

        // ==========================================
        // MAIN APP WORKSPACE CORE
        // ==========================================
        function MainDashboardLayout() {
          const [activeTab, setActiveTab] = useState('dashboard');

          const renderViewContent = () => {
            switch (activeTab) {
              case 'dashboard': return <DashboardView />;
              case 'pipeline': return <PipelineView />;
              case 'finances': return <FinanceView />;
              case 'tracker': return <TrackerView />;
              case 'utilities': return <UtilitiesView />;
              default: return <DashboardView />;
            }
          };

          return (
            <div class="flex bg-[#0B0F19] min-h-screen font-sans text-gray-200 antialiased">
              <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} />
              <main class="flex-1 overflow-y-auto max-h-screen">
                <header class="border-b border-[#24324F] bg-[#151D30]/40 backdrop-blur px-8 py-4 flex items-center justify-between sticky top-0 z-40">
                  <div class="text-xs font-bold tracking-wider text-gray-500 uppercase">Enterprise Video Workspace Profile Studio</div>
                  <div class="flex items-center gap-4">
                    <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                      <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                      Local Web Storage Engine Active
                    </span>
                  </div>
                </header>
                <div class="p-8 max-w-7xl mx-auto w-full">
                  {renderViewContent()}
                </div>
              </main>
            </div>
          );
        }

        function App() {
          return (
            <AppStateProvider>
              <MainDashboardLayout />
            </AppStateProvider>
          );
        }

        // Render the application setup into the DOM
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
